name: Compilar APK de PaperView

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar el wrapper de Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Dar permisos de ejecución
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: PaperView-APK
          path: app/build/outputs/apk/debug/app-debug.apk